  <!-- Lazy-load background video only after page is interactive so player doesn't get blocked -->
  <script>
    async function lazyLoadBgVideo() {
      const video = document.querySelector("video.scene__img");
      if (!video) return;
      // Only trigger actual download now
      video.preload = "auto";
      video.load();
      video.play().catch(() => {});


    }
    // Start video load after page is interactive and player has had time to initialise
    if (document.readyState === "complete") {
      setTimeout(lazyLoadBgVideo, 500);
    } else {
      window.addEventListener("load", () => setTimeout(lazyLoadBgVideo, 500));
    }
  </script>

  <script>
    // Create a native media session and silent audio to keep the background active
    (function() {
      // Tiny 1-second silent MP3 base64
      const silentAudio = new Audio("data:audio/mp3;base64,//MkxAAQACcAIUAFACAAUABAAEAAAEAwAAoBAAAwAAoBAAAABgBwAA8BAAABgBwAA8BAAAEBwEAAA8BAAAEBwEAAA8BAAAAAAAAAAA=");
      silentAudio.loop = true;
      silentAudio.volume = 0.01;

      const initAudio = () => {
        silentAudio.play().catch(e => {});
        document.removeEventListener('click', initAudio);
        document.removeEventListener('touchstart', initAudio);
        
        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: 'Vibe Room',
            artist: 'Playing in background',
            album: 'Radio'
          });
          // Empty handlers trick Android into keeping the media session active
          navigator.mediaSession.setActionHandler('play', () => {});
          navigator.mediaSession.setActionHandler('pause', () => {});
        }
      };

      document.addEventListener('click', initAudio);
      document.addEventListener('touchstart', initAudio);
    })();
  </script>
